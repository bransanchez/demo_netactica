<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Demo Netactica · Ejecución en vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ok:#16a34a;--err:#dc2626;--run:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#9aa0a6;--bd:#2c3037}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:16px;margin:0;flex:1}button{padding:8px 16px;border:0;border-radius:6px;background:var(--run);color:#fff;cursor:pointer;font-size:14px}
button:disabled{opacity:.5}main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.step{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.running .dot{background:var(--run);animation:p 1s infinite}.ok .dot{background:var(--ok)}.error .dot{background:var(--err)}
@keyframes p{50%{opacity:.3}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td.url{max-width:420px;overflow:hidden;text-overflow:ellipsis}tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.s2{color:var(--ok)}.s4,.s5,.failed{color:var(--err)}.pending{color:var(--mut)}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px;max-height:240px;overflow:auto;font-size:12px}
#info{color:var(--mut);margin-top:8px}img{max-width:100%;border:1px solid var(--bd);border-radius:6px;margin-top:8px}
input{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
</style></head><body>
<header><h1>Demo Netactica · ejecución en vivo</h1><span id="status" style="color:var(--mut)">Listo</span>
<button id="run">▶ Ejecutar</button></header>
<main>
<section class="card"><b>Pasos</b><div id="steps"></div><div id="info"></div><div id="shot"></div></section>
<section class="card"><div style="display:flex;gap:8px;margin-bottom:8px"><b style="flex:1">Network (<span id="count">0</span>)</b>
<input id="filter" placeholder="Filtrar por URL"></div>
<div class="tw"><table><thead><tr><th>Método</th><th>URL</th><th>Estado</th><th>Tipo</th><th>Tiempo</th><th>Tamaño</th></tr></thead>
<tbody id="rows"></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const reqs=new Map();
function esc(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function renderRows(){
  const f=$("filter").value.toLowerCase();
  $("rows").innerHTML="";$("count").textContent=reqs.size;
  for(const q of reqs.values()){
    if(f&&!q.url.toLowerCase().includes(f))continue;
    const tr=document.createElement("tr");tr.className="r";
    const cls=q.state==="failed"?"failed":q.status?"s"+String(q.status)[0]:"pending";
    tr.innerHTML=`<td>${q.method}</td><td class="url" title="${esc(q.url)}">${esc(q.url)}</td>
    <td class="${cls}">${q.state==="failed"?"FAILED":q.status??"…"}</td><td>${esc(q.type)}</td>
    <td>${q.time_ms!=null?q.time_ms+" ms":"…"}</td><td>${q.size!=null?(q.size/1024).toFixed(1)+" kB":"…"}</td>`;
    tr.onclick=()=>toggle(tr,q);$("rows").appendChild(tr);
  }
}
function toggle(tr,q){
  if(tr.nextSibling&&tr.nextSibling.className==="d"){tr.nextSibling.remove();return}
  const d=document.createElement("tr");d.className="d";
  d.innerHTML=`<td colspan="6"><b>Request headers</b><pre>${esc(JSON.stringify(q.req_headers,null,2))}</pre>
  ${q.post_data?`<b>Payload</b><pre>${esc(q.post_data)}</pre>`:""}
  <b>Response headers</b><pre>${esc(JSON.stringify(q.res_headers||{},null,2))}</pre>
  ${q.body?`<b>Response</b><pre>${esc(q.body)}</pre>`:""}</td>`;
  tr.after(d);
}
function renderSteps(list){$("steps").innerHTML=list.map((n,i)=>`<div class="step" id="st${i}"><span class="dot"></span>${esc(n)}</div>`).join("")}
const es=new EventSource("/stream");
es.onmessage=e=>{
  const ev=JSON.parse(e.data);
  if(ev.type==="reset"){reqs.clear();renderSteps(ev.steps);renderRows();$("info").textContent="";$("shot").innerHTML="";$("status").textContent="Ejecutando…";$("run").disabled=true}
  else if(ev.type==="step"){const el=$("st"+ev.index);if(el)el.className="step "+ev.status;
    if(ev.screenshot)$("shot").innerHTML=`<img src="data:image/png;base64,${ev.screenshot}">`;
    if(ev.error)$("info").textContent="Error: "+ev.error}
  else if(ev.type==="net"){reqs.set(ev.id,ev);renderRows()}
  else if(ev.type==="info"){$("info").textContent=ev.message}
  else if(ev.type==="done"){$("status").textContent=ev.ok?"✔ Finalizó correctamente":"✖ Finalizó con error";$("run").disabled=false}
};
$("filter").oninput=renderRows;
$("run").onclick=()=>fetch("/run",{method:"POST"});
</script></body></html>
